steps:
  - group: "Coverage"
    # Temporary coverage-only validation branch. Only
    # julia-ci holds the codecov / coveralls bearer tokens; PR builds run
    # the same coverage collection but skip the uploads (the lcov tarball
    # is still available as a buildkite artifact).
    notify:
      - github_commit_status:
          context: "Coverage"
    steps:
      - label: ":linux: coverage (x86_64)"
        key:   "coverage-linux"
        plugins:
          - JuliaCI/external-buildkite#v1:
              version: "./.buildkite-external-version"
              repo_url: "https://github.com/JuliaCI/julia-buildkite"
          - JuliaCI/julia#v1:
              # Drop default "registries" directory, so it is not persisted from execution to execution
              persist_depot_dirs: packages,artifacts,compiled
              version: '1.11' # GREP_ME: Keep this updated. Do not set it to '1' or 'stable' or 'latest'.
          - JuliaCI/sandbox#v2:
              rootfs_url: https://github.com/JuliaCI/rootfs-images/releases/download/v8.5/package_linux.x86_64.tar.gz
              rootfs_treehash: "8b46765146862479f0a8946f2ef783a8bf93b20f"
              uid: 1000
              gid: 1000
              workspaces:
                - "/cache/repos:/cache/repos"
        timeout_in_minutes: 720 # 12h
        commands: |
          echo "--- Obtain coverage tokens"
          # Coverage tokens are fetched from SSM Parameter Store with this
          # job's OIDC identity; no static secrets exist in CI config.
          # Only julia-ci holds tokens (PR builds and the julia-buildkite
          # self-test have no tokens role): collect coverage anyway, skip
          # the uploads below.
          if [[ "$${BUILDKITE_PIPELINE_SLUG}" != "julia-ci" ]]; then
            echo "No coverage tokens in this pipeline; coverage uploads will be skipped"
          else
            source .buildkite/utilities/aws_oidc.sh tokens
            CODECOV_TOKEN="$$(aws ssm get-parameter --with-decryption --name /julia-ci/tokens/codecov_token --query Parameter.Value --output text)" || { echo "Failed to fetch Codecov token" >&2; exit 1; }
            COVERALLS_TOKEN="$$(aws ssm get-parameter --with-decryption --name /julia-ci/tokens/coveralls_token --query Parameter.Value --output text)" || { echo "Failed to fetch Coveralls token" >&2; exit 1; }
            export CODECOV_TOKEN COVERALLS_TOKEN
            [[ -n "$${CODECOV_TOKEN}" && -n "$${COVERALLS_TOKEN}" ]] || { echo "Coverage token fetch returned an empty value" >&2; exit 1; }
          fi

          echo "--- Build Julia from source"
          # Compile coverage into the sysimage and stdlib package images so
          # test processes can reuse their native code under coverage.
          make --output-sync -j$${JULIA_NUM_THREADS} JULIA_COVERAGE_IMAGES=1

          echo "--- Print Julia version info"
          ./julia --color=yes -e 'using InteractiveUtils; InteractiveUtils.versioninfo()'
          ./julia --color=yes -e '@info "" Sys.CPU_THREADS'
          # this is necessary to make sure that the LibGit2 tests passes
          git config --global init.defaultBranch master

          echo "--- Run Julia tests in parallel with code coverage enabled"
          export JULIA_NUM_THREADS=1
          export JULIA_WORKER_TIMEOUT=1200 # 1200 seconds = 20 minutes
          ./julia --color=yes -e 'import Distributed; @info "" Distributed.worker_timeout()'
          ./julia --color=yes .buildkite/pipelines/scheduled/coverage/run_tests_parallel.jl

          echo "--- Move the lcov files into the `./lcov_files` directory"
          ls *.info
          mkdir -p lcov_files
          mv *.info lcov_files
          ls lcov_files

          echo "--- Upload lcov files"
          tar -zcf lcov_files.tar.gz lcov_files/
          buildkite-agent artifact upload lcov_files.tar.gz

          echo "--- Validate and upload coverage information"
          # The script parses and merges LCOV data and requires at least 60%
          # total coverage. It skips the service uploads when tokens are absent.
          ./julia --color=yes .buildkite/pipelines/scheduled/coverage/upload_coverage.jl
        agents:
          queue: "test"
          # Only run on `sandbox.jl` machines (not `docker`-isolated ones) since we need nestable sandboxing
          sandbox_capable: "true"
          os: "linux"
          arch: "x86_64"
        env:
          # Set build number for Coveralls parallel mode
          COVERALLS_SERVICE_NUMBER: ${BUILDKITE_BUILD_NUMBER}

      - label: ":macos: coverage (aarch64)"
        key:   "coverage-macos-aarch64"
        plugins:
          - JuliaCI/external-buildkite#v1:
              version: "./.buildkite-external-version"
              repo_url: "https://github.com/JuliaCI/julia-buildkite"
          - JuliaCI/julia#v1:
              # Drop default "registries" directory, so it is not persisted from execution to execution
              persist_depot_dirs: packages,artifacts,compiled
              version: '1.11' # GREP_ME: Keep this updated. Do not set it to '1' or 'stable' or 'latest'.
        timeout_in_minutes: 360 # 6h
        commands: |
          echo "--- Obtain coverage tokens"
          # Coverage tokens are fetched from SSM Parameter Store with this
          # job's OIDC identity; no static secrets exist in CI config.
          # Only julia-ci holds tokens (PR builds and the julia-buildkite
          # self-test have no tokens role): collect coverage anyway, skip
          # the uploads below.
          if [[ "$${BUILDKITE_PIPELINE_SLUG}" != "julia-ci" ]]; then
            echo "No coverage tokens in this pipeline; coverage uploads will be skipped"
          else
            source .buildkite/utilities/aws_oidc.sh tokens
            CODECOV_TOKEN="$$(aws ssm get-parameter --with-decryption --name /julia-ci/tokens/codecov_token --query Parameter.Value --output text)" || { echo "Failed to fetch Codecov token" >&2; exit 1; }
            COVERALLS_TOKEN="$$(aws ssm get-parameter --with-decryption --name /julia-ci/tokens/coveralls_token --query Parameter.Value --output text)" || { echo "Failed to fetch Coveralls token" >&2; exit 1; }
            export CODECOV_TOKEN COVERALLS_TOKEN
            [[ -n "$${CODECOV_TOKEN}" && -n "$${COVERALLS_TOKEN}" ]] || { echo "Coverage token fetch returned an empty value" >&2; exit 1; }
          fi

          echo "--- Build Julia from source"
          # Compile coverage into the sysimage and stdlib package images, as
          # in the Linux job above.
          make -j$${JULIA_NUM_THREADS} JULIA_COVERAGE_IMAGES=1

          echo "--- Print Julia version info"
          ./julia --color=yes -e 'using InteractiveUtils; InteractiveUtils.versioninfo()'
          ./julia --color=yes -e '@info "" Sys.CPU_THREADS'
          # this is necessary to make sure that the LibGit2 tests passes
          git config --global init.defaultBranch master

          echo "--- Run Julia tests in parallel with code coverage enabled"
          export JULIA_NUM_THREADS=1
          export JULIA_WORKER_TIMEOUT=1200 # 1200 seconds = 20 minutes
          ./julia --color=yes -e 'import Distributed; @info "" Distributed.worker_timeout()'
          ./julia --color=yes .buildkite/pipelines/scheduled/coverage/run_tests_parallel.jl

          echo "--- Move the lcov files into the `./lcov_files` directory"
          ls *.info
          mkdir -p lcov_files
          mv *.info lcov_files
          ls lcov_files

          echo "--- Upload lcov files"
          tar -zcf lcov_files.tar.gz lcov_files/
          buildkite-agent artifact upload lcov_files.tar.gz

          echo "--- Validate and upload coverage information"
          # See the Linux job.
          ./julia --color=yes .buildkite/pipelines/scheduled/coverage/upload_coverage.jl
        agents:
          queue: "test"
          os: "macos"
          arch: "aarch64"
        env:
          JULIA_SHELL: "/bin/bash"
          # Set build number for Coveralls parallel mode
          COVERALLS_SERVICE_NUMBER: ${BUILDKITE_BUILD_NUMBER}

      - label: ":windows: coverage (x86_64)"
        key:   "coverage-windows-x86_64"
        plugins:
          - JuliaCI/external-buildkite#v1:
              version: "./.buildkite-external-version"
              repo_url: "https://github.com/JuliaCI/julia-buildkite"
          - JuliaCI/julia#v1:
              # Drop default "registries" directory, so it is not persisted from execution to execution
              persist_depot_dirs: packages,artifacts,compiled
              version: '1.11' # GREP_ME: Keep this updated. Do not set it to '1' or 'stable' or 'latest'.
          - docker#v3.13.0:
              image: "juliapackaging/package-windows-x86_64:v8.5"
              always-pull: true
              command: ["bash", "-c", "
                echo '--- Obtain coverage tokens' &&
                if [[ $${BUILDKITE_PIPELINE_SLUG} != julia-ci ]]; then
                  echo 'No coverage tokens in this pipeline; coverage uploads will be skipped';
                else
                  source .buildkite/utilities/aws_oidc.sh tokens &&
                  CODECOV_TOKEN=$$(MSYS2_ARG_CONV_EXCL='*' MSYS_NO_PATHCONV=1 aws ssm get-parameter --with-decryption --name /julia-ci/tokens/codecov_token --query Parameter.Value --output text) &&
                  COVERALLS_TOKEN=$$(MSYS2_ARG_CONV_EXCL='*' MSYS_NO_PATHCONV=1 aws ssm get-parameter --with-decryption --name /julia-ci/tokens/coveralls_token --query Parameter.Value --output text) &&
                  export CODECOV_TOKEN COVERALLS_TOKEN &&
                  [[ -n $${CODECOV_TOKEN} && -n $${COVERALLS_TOKEN} ]] || { echo 'Coverage token fetch returned an empty value' >&2; exit 1; };
                fi &&
                echo '--- Build Julia from source' &&
                make -j$${JULIA_NUM_THREADS} VERBOSE=1 JULIA_COVERAGE_IMAGES=1 &&
                echo '--- Print Julia version info' &&
                ./usr/bin/julia.exe --color=yes -e 'using InteractiveUtils; InteractiveUtils.versioninfo()' &&
                ./usr/bin/julia.exe --color=yes -e '@info \"\" Sys.CPU_THREADS' &&
                git config --global init.defaultBranch master &&
                echo '--- Run Julia tests in parallel with code coverage enabled' &&
                export JULIA_NUM_THREADS=1 &&
                export JULIA_WORKER_TIMEOUT=1200 &&
                ./usr/bin/julia.exe --color=yes -e 'import Distributed; @info \"\" Distributed.worker_timeout()' &&
                ./usr/bin/julia.exe --color=yes .buildkite/pipelines/scheduled/coverage/run_tests_parallel.jl &&
                echo '--- Move the lcov files into the ./lcov_files directory' &&
                ls *.info &&
                mkdir -p lcov_files &&
                mv *.info lcov_files &&
                ls lcov_files &&
                echo '--- Upload lcov files' &&
                tar -zcf lcov_files.tar.gz lcov_files/ &&
                buildkite-agent artifact upload lcov_files.tar.gz &&
                echo '--- Validate and upload coverage information' &&
                ./usr/bin/julia.exe --color=yes .buildkite/pipelines/scheduled/coverage/upload_coverage.jl
                "]
              propagate-environment: true
              volumes:
                # Mount buildkite-agent as well
                - "C:\\buildkite-agent\\bin:C:\\buildkite-agent\\bin"
              environment:
                - "JULIA_CPU_THREADS"
                - "BUILDKITE_AGENT_ACCESS_TOKEN"
                - "BUILDKITE_BRANCH"
                - "BUILDKITE_COMMIT"
                - "BUILDKITE_REPO"
                - "BUILDKITE_MESSAGE"
                - "BUILDKITE_BUILD_AUTHOR"
                - "BUILDKITE_BUILD_CREATOR"
                - "BUILDKITE_BUILD_AUTHOR_EMAIL"
                - "BUILDKITE_BUILD_CREATOR_EMAIL"
                - "BUILDKITE_PULL_REQUEST"
                - "BUILDKITE_BUILD_NUMBER"
                - "BUILDKITE_PIPELINE_SLUG"
        timeout_in_minutes: 720 # 12h
        agents:
          queue: "test"
          os: "windows"
          arch: "x86_64"
        env:
          JULIA_SHELL: "/bin/bash"
          # Set build number for Coveralls parallel mode
          COVERALLS_SERVICE_NUMBER: ${BUILDKITE_BUILD_NUMBER}

      - label: "Finalize parallel coverage"
        key: "coverage-finalize"
        depends_on:
          - step: "coverage-linux"
            allow_failure: true
          - step: "coverage-macos-aarch64"
            allow_failure: true
          - step: "coverage-windows-x86_64"
            allow_failure: true
        plugins:
          - JuliaCI/external-buildkite#v1:
              version: "./.buildkite-external-version"
              repo_url: "https://github.com/JuliaCI/julia-buildkite"
          - JuliaCI/julia#v1:
              # Drop default "registries" directory, so it is not persisted from execution to execution
              persist_depot_dirs: packages,artifacts,compiled
              version: '1.11' # GREP_ME: Keep this updated. Do not set it to '1' or 'stable' or 'latest'.
          # The token fetch below needs the `aws` CLI, which the bare test
          # agents do not have; run inside the package_linux rootfs (which
          # ships it), like the linux coverage job above.
          - JuliaCI/sandbox#v2:
              rootfs_url: https://github.com/JuliaCI/rootfs-images/releases/download/v8.5/package_linux.x86_64.tar.gz
              rootfs_treehash: "8b46765146862479f0a8946f2ef783a8bf93b20f"
              uid: 1000
              gid: 1000
          # List the julia plugin again so `julia` is also set up inside the
          # sandbox (same pattern as misc/whitespace.yml).
          - JuliaCI/julia#v1:
              # Drop default "registries" directory, so it is not persisted from execution to execution
              persist_depot_dirs: packages,artifacts,compiled
              version: '1.11' # GREP_ME: Keep this updated. Do not set it to '1' or 'stable' or 'latest'.
        timeout_in_minutes: 10
        commands: |
          echo "--- Signal completion of parallel coverage uploads"
          if [[ "$${BUILDKITE_PIPELINE_SLUG}" == "julia-ci" ]]; then
            # The coveralls token is fetched from SSM Parameter Store with
            # this job's OIDC identity; no static secrets exist in CI config.
            source .buildkite/utilities/aws_oidc.sh tokens
            COVERALLS_TOKEN="$$(aws ssm get-parameter --with-decryption --name /julia-ci/tokens/coveralls_token --query Parameter.Value --output text)" || { echo "Failed to fetch Coveralls token" >&2; exit 1; }
            export COVERALLS_TOKEN
            [[ -n "$${COVERALLS_TOKEN}" ]] || { echo "Coveralls token fetch returned an empty value" >&2; exit 1; }
          fi

          if [[ -n "$${COVERALLS_TOKEN:-}" ]]; then
            julia --color=yes .buildkite/pipelines/scheduled/coverage/finish_parallel_coverage.jl
          else
            echo "No Coveralls token; nothing to finalize"
          fi
        agents:
          queue: "test"
          # Only run on `sandbox.jl` machines (not `docker`-isolated ones) since we need nestable sandboxing
          sandbox_capable: "true"
          os: "linux"
          arch: "x86_64"
        env:
          # Set build number for Coveralls parallel mode
          COVERALLS_SERVICE_NUMBER: ${BUILDKITE_BUILD_NUMBER}
