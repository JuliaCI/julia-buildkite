# Launch the coverage pipeline.
#
# Coverage is launched here, as a SEPARATE pipeline upload from the build/test
# launchers. Publishing is gated per platform on that platform's own build and
# test jobs (the Publish group rendered by render_launch_pipeline.py), so a
# long scheduled coverage run never delays a julia-publish trigger.
steps:
  - group: "Upload"
    steps:
      - label: "Launch coverage"
        # Labeled pull requests get coverage from the main launch step
        if: build.pull_request.id == null
        plugins:
          - JuliaCI/external-buildkite#v1:
              version: "./.buildkite-external-version"
              repo_url: "https://github.com/JuliaCI/julia-buildkite"
        commands: |
          # Launch the code coverage job (scheduled julia-ci builds; see the
          # conditionals inside)
          buildkite-agent pipeline upload .buildkite/pipelines/scheduled/coverage/coverage.yml

        agents:
          queue: "launch"
          os: "linux"
          arch: "x86_64" # prevent from running on PiBots
