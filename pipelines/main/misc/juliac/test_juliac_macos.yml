priority: ${JULIA_CI_PRIORITY:-0}
steps:
  - group: "${GROUP?}"
    steps:
      - label: ":macos: test JuliaC ${TRIPLET?}"
        key: "test-juliac-${TRIPLET?}"
        depends_on:
          - "build_${TRIPLET?}"
        plugins:
          - JuliaCI/external-buildkite#v1:
              version: "./.buildkite-external-version"
              repo_url: "https://github.com/JuliaCI/julia-buildkite"
        commands: |
          # Download pre-built julia, extract into `usr/`
          buildkite-agent artifact download --step "build_${TRIPLET}" 'julia-*-macos-${ARCH?}.tar.gz' .
          mkdir -p ./usr
          tar -C ./usr --strip-components=1 -zxf julia-*-macos-${ARCH?}.tar.gz
          ln -s ./usr/bin/julia ./julia

          # Re-sign after download
          .buildkite/utilities/macos/codesign.sh ./usr

          # Re-signing changed the pkgimage bytes, so repair the checksums
          # recorded in the stdlib .ji cache files (as test_julia.sh does);
          # otherwise every stdlib cache is considered stale and recompiled.
          JULIA_DEBUG=all ./usr/bin/julia .buildkite/utilities/update_stdlib_pkgimage_checksums.jl

          echo "--- Install and test JuliaC"
          unset JULIA_DEPOT_PATH
          # Compile the test apps (and test/trim) for this machine only. Otherwise JuliaC
          # targets every CPU in the sysimage's target list (4 on x86_64, 6 on aarch64),
          # which makes the untrimmed app tests 2-3x slower.
          export JULIA_CPU_TARGET=native
          if [ -f deps/jlutilities/juliac/Manifest.toml ]; then
            JULIA_PKG_PRECOMPILE_AUTO=0 ./julia -e 'using Pkg; Pkg.activate("deps/jlutilities/juliac"); Pkg.instantiate(); ENV["JULIA_PKG_PRECOMPILE_AUTO"]=1; Pkg.test("JuliaC")'
          else
            JULIA_PKG_PRECOMPILE_AUTO=0 ./julia -e 'using Pkg; Pkg.add(name="JuliaC", rev="main"); ENV["JULIA_PKG_PRECOMPILE_AUTO"]=1; Pkg.test("JuliaC")'
          fi

          echo "--- Test trimming the Julia repo's projects (test/trim)"
          ./julia test/trim.jl
        timeout_in_minutes: ${TIMEOUT?}
        soft_fail: ${ALLOW_FAIL?}
        agents:
          queue: "test"
          # Tagged so that a Mac runs it next to other light jobs instead of
          # alone (untagged macOS jobs get the whole host). It averages 2.5-3
          # busy CPUs, wider while precompiling, and peaks at ~6 GiB.
          sched_cpus: "3"
          sched_cpus_limit: "6"
          sched_mem_gib: "4"
          sched_mem_limit_gib: "8"
          os: "macos"
          arch: "${ARCH}"
