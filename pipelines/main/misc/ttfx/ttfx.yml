steps:
  - group: "TTFX"
    notify:
      - github_commit_status:
          context: "TTFX"
    steps:
      - label: "Launch TTFX benchmark jobs"
        # A julia-pr build is measured against the master build of its
        # merge-base; a julia-ci commit, and the julia master commit the
        # julia-buildkite self-test builds, on their own (utilities/ttfx/README.md).
        if: pipeline.slug == "julia-pr" || pipeline.slug == "julia-ci" || pipeline.slug == "julia-buildkite-ci"
        plugins:
          - JuliaCI/external-buildkite#v1:
              version: "./.buildkite-external-version"
              repo_url: "https://github.com/JuliaCI/julia-buildkite"
        commands: |
          GROUP="TTFX" \
              bash .buildkite/utilities/arches_pipeline_upload.sh \
              .buildkite/pipelines/main/misc/ttfx/ttfx_macos.arches \
              .buildkite/pipelines/main/misc/ttfx/ttfx_macos.yml
        agents:
          queue: "launch"
          os: "linux"
          arch: "x86_64"
