steps:
  - group: "TTFX"
    steps:
      - label: "Launch TTFX benchmark jobs"
        # julia-ci commits and the julia-buildkite self-test are always measured. A
        # julia-pr pull request is measured only when it touches a path in
        # utilities/ttfx/paths.txt (the runtime, the compiler, loading) or has the
        # `needs TTFX check` label; ttfx_launch.sh decides. The TTFX commit status is
        # the job's own, so a pull request that is not measured shows none
        # (utilities/ttfx/README.md).
        if: pipeline.slug == "julia-pr" || pipeline.slug == "julia-ci" || pipeline.slug == "julia-buildkite-ci"
        plugins:
          - JuliaCI/external-buildkite#v1:
              version: "./.buildkite-external-version"
              repo_url: "https://github.com/JuliaCI/julia-buildkite"
        commands: "bash .buildkite/utilities/ttfx/ttfx_launch.sh"
        agents:
          queue: "launch"
          os: "linux"
          arch: "x86_64"
