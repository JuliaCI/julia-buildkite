steps:
  - group: "Check"
    steps:
      - label: "llvmpasses"
        key: "llvmpasses"
        # Reuse the assert build (`FORCE_ASSERTIONS=1 LLVM_ASSERTIONS=1`) instead of building again
        depends_on:
          - "build_x86_64-linux-gnuassert"
        plugins:
          - JuliaCI/julia#v1:
              # Drop default "registries" directory, so it is not persisted from execution to execution
              persist_depot_dirs: packages,artifacts,compiled
              version: '1.10' # GREP_ME: Keep this updated to LTS. Do not set it to '1' or 'stable' or 'latest'.
          - JuliaCI/sandbox#v2:
              rootfs_url: https://github.com/JuliaCI/rootfs-images/releases/download/v8.8/package_linux.x86_64.tar.gz
              rootfs_treehash: "7db0eac9cfbe5b38ecb05d2b91881f46cff4097d"
              uid: 1000
              gid: 1000
              workspaces:
                - "/cache/repos:/cache/repos"
        commands: |
          # Download pre-built assert julia, extract into `usr/`
          buildkite-agent artifact download --step "build_x86_64-linux-gnuassert" 'julia-*-linuxassert-x86_64.tar.gz' .
          mkdir -p usr
          tar -C usr --strip-components=1 -zxf julia-*-linuxassert-x86_64.tar.gz
          rm -f julia-*-linuxassert-x86_64.tar.gz

          echo "+++ make test/llvmpasses"
          # Installs `opt`, `FileCheck`, `lit`, etc. from the assert LLVM JLLs (download only).
          # `libjulia-codegen` (the `opt` pass plugin) lives in `usr/lib/julia` in a binary-dist.
          export LD_LIBRARY_PATH="$$(pwd)/usr/lib/julia$${LD_LIBRARY_PATH:+:$$LD_LIBRARY_PATH}"
          make --output-sync -j$${JULIA_CPU_THREADS:?} -C test/llvmpasses LLVM_ASSERTIONS=1
        timeout_in_minutes: 60
        agents:
          queue: "test"
          sched_cpus: "2"
          sched_threads: "8"
          sched_mem_gib: "16"
          sandbox_capable: "true"
          os: "linux"
          arch: "x86_64"
