steps:
  - group: "Check"
    steps:
      - label: "pdf_docs_build"
        key: pdf_docs_build
        depends_on:
          - "build_x86_64-linux-gnu"
        plugins:
          - JuliaCI/external-buildkite#v1:
              version: "./.buildkite-external-version"
              repo_url: "https://github.com/JuliaCI/julia-buildkite"
          - JuliaCI/julia#v1:
              # Drop default "registries" directory, so it is not persisted from execution to execution
              persist_depot_dirs: packages,artifacts,compiled
              version: '1.11' # GREP_ME: Keep this updated. Do not set it to '1' or 'stable' or 'latest'.
          - JuliaCI/sandbox#v2:
              rootfs_url: https://github.com/JuliaCI/rootfs-images/releases/download/v6.00/latex.x86_64.tar.gz
              rootfs_treehash: "48f7c99f62ac7f2a8212d106059be1dddc3aa6bf"
              uid: 1000
              gid: 1000
              workspaces:
                # Include `/cache/repos` so that our `git` version introspection works.
                - "/cache/repos:/cache/repos"
        commands: |
          echo "--- Download pre-built julia, extract into usr/"
          buildkite-agent artifact download --step "build_x86_64-linux-gnu" 'julia-*-linux-x86_64.tar.gz' .
          mkdir -p ./usr
          tar -C ./usr --strip-components=1 -zxf julia-*-linux-x86_64.tar.gz
          ln -s ./usr/bin/julia ./julia

          echo "--- Print Julia version info"
          export JULIA_NUM_THREADS=1
          ./julia -e 'using InteractiveUtils; InteractiveUtils.versioninfo()'

          echo "--- Set some environment variables and create some directories"
          export DOCUMENTER_LATEX_DEBUG="$$(pwd)/latex-debug-logs"
          mkdir -p $${DOCUMENTER_LATEX_DEBUG:?}
          echo "DOCUMENTER_LATEX_DEBUG is $${DOCUMENTER_LATEX_DEBUG:?}"
          # Documenter compiles in a fresh directory, so minted would run pygmentize
          # for every code block on every job. Keep its cache under the build path,
          # which the sandbox mounts read-write; the depot is not mounted, so writes
          # there are dropped with the sandbox overlay. (Julia trees whose
          # doc/src/assets/preamble.tex predates the variable ignore it.)
          export JULIA_MINTED_CACHEDIR="$${BUILDKITE_BUILD_PATH:?}/minted-cache"
          mkdir -p "$${JULIA_MINTED_CACHEDIR:?}"
          echo "JULIA_MINTED_CACHEDIR is $${JULIA_MINTED_CACHEDIR:?}"

          echo "--- Build the PDF"
          ./julia .buildkite/pipelines/main/misc/pdf_docs/make.jl

          echo "--- Drop minted cache entries this build did not use"
          # minted prunes against the previous run's .aux, which a fresh directory lacks;
          # Documenter copies the final one into DOCUMENTER_LATEX_DEBUG.
          aux="$${DOCUMENTER_LATEX_DEBUG:?}/TheJuliaLanguage.aux"
          if [[ -f "$${aux}" ]]; then
              keep="$$(mktemp)"
              grep -o '[0-9A-F]\{64\}\.pygtex' "$${aux}" | sort -u > "$${keep}"
              [[ -s "$${keep}" ]] && (cd "$${JULIA_MINTED_CACHEDIR:?}" && find . -maxdepth 1 -name '*.pygtex' -printf '%f\n' |
                  grep -vxFf "$${keep}" | xargs -r rm -f --)
              rm -f "$${keep}"
          fi

          echo "--- Upload the PDF files as Buildkite artifacts"
          find . -type f -name "*.pdf"
          cd doc/_build/pdf/en && buildkite-agent artifact upload TheJuliaLanguage.pdf
        timeout_in_minutes: 120
        agents:
          queue: "test"
          # Mostly one busy CPU, which is what it is charged; compilers and
          # precompilation may run on up to 8.
          sched_cpus: "1"
          sched_cpus_limit: "8"
          sched_mem_gib: "2"
          sched_mem_limit_gib: "8"
          sandbox_capable: "true"
          os: "linux"
          arch: "x86_64"
