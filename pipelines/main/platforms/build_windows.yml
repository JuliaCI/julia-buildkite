steps:
  - group: "${GROUP?}"
    steps:
      - label: ":windows: build ${TRIPLET?}"
        key: "build_${TRIPLET?}"
        plugins:
          - JuliaCI/external-buildkite#v1:
              version: "./.buildkite-external-version"
              repo_url: "https://github.com/JuliaCI/julia-buildkite"
          - docker#v3.13.0:
              image: "juliapackaging/package-windows-${DOCKER_ARCH?}:${DOCKER_TAG?}"
              always-pull: true
              command: ["bash", ".buildkite/utilities/build_julia.sh"]
              propagate-environment: true
              volumes:
                # Mount buildkite-agent as well
                - "C:\\buildkite-agent\\bin:C:\\buildkite-agent\\bin"
              environment:
                # We have to list this here, because buildkite doesn't automatically
                # include environment-hook-set variables in a way that the docker
                # plugin finds.  It's annoying, but at least we have a workaround.
                - "JULIA_CPU_THREADS"
                - "JULIA_CI_BUILD_MODE"
                # Have to include this for `buildkite-agent` to work:
                - "BUILDKITE_AGENT_ACCESS_TOKEN"
        timeout_in_minutes: ${TIMEOUT?}
        # Retry if the agent was lost (-1 without a signal reason) or stopped under the job
        # (agent_stop, with whatever status the job exited with): a host or scheduler
        # restart. Timeouts and cancellations have signal_reason "cancel" and are not retried.
        retry:
          automatic:
            - exit_status: -1
              signal_reason: [none, agent_stop]
              limit: 1
            - exit_status: "*"
              signal_reason: agent_stop
              limit: 1
        soft_fail: ${ALLOW_FAIL?}
        agents:
          queue: "build"
          # More than 6 vCPUs trips the virtio NIC bug on the current images
          sched_cpus: "4"
          sched_threads: "6"
          sched_mem_gib: "24"
          os: "windows"
          arch: "${ARCH?}"
        env:
          # Receive some environment mappings from our templating engine
          TRIPLET: "${TRIPLET?}"
          MAKE_FLAGS: "${MAKE_FLAGS?}"
          JULIA_CI_BUILD_MODE: "${JULIA_CI_BUILD_MODE-}"
