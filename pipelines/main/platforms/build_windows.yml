steps:
  - group: "${GROUP?}"
    steps:
      - label: ":windows: build ${TRIPLET?}"
        key: "build_${TRIPLET?}"
        plugins:
          - JuliaCI/external-buildkite#v1:
              version: "./.buildkite-external-version"
              repo_url: "https://github.com/JuliaCI/julia-buildkite"
          - JuliaCI/julia#v1:
              # Drop default "registries" directory, so it is not persisted from execution to execution
              persist_depot_dirs: packages,artifacts,compiled
              # Only installs the toolchain, which needs no registry
              update_registry: false
              version: '1.10' # GREP_ME: Keep this updated to LTS. Do not set it to '1' or 'stable' or 'latest'.
        commands: |
          set -euo pipefail
          # The toolchain (MSYS2 + GCC) is a rootfs-images tree, installed as an artifact into
          # the julia plugin's depot, which lives in this job's cache pool.
          echo "--- Install the toolchain"
          TOOLCHAIN="$$(julia --startup-file=no .buildkite/utilities/windows/install_toolchain.jl \
                          "${ROOTFS_IMAGE_NAME?}.${ARCH_ROOTFS?}.${ROOTFS_TAG?}" "${ROOTFS_HASH?}")"
          # The build does not use the plugin's Julia depot (nor did it in the container)
          unset JULIA_DEPOT_PATH
          bash .buildkite/utilities/windows/toolchain.sh --root "$${TOOLCHAIN}" .buildkite/utilities/build_julia.sh
        timeout_in_minutes: ${TIMEOUT?}
        soft_fail: ${ALLOW_FAIL?}
        agents:
          queue: "build"
          # More than 6 vCPUs trips the virtio NIC bug on the current images
          sched_cpus: "3"
          sched_cpus_limit: "6"
          sched_mem_gib: "16"
          os: "windows"
          arch: "${ARCH?}"
        env:
          # Receive some environment mappings from our templating engine
          TRIPLET: "${TRIPLET?}"
          MAKE_FLAGS: "${MAKE_FLAGS?}"
