steps:
  - group: "${GROUP?}"
    steps:
      - label: ":windows: test ${TRIPLET?}"
        key: "test_${TRIPLET?}"
        depends_on:
          - "build_${TRIPLET?}"
        plugins:
          - JuliaCI/coreupload#v2:
              # The workers' crash dump folder (WER LocalDumps). libuv also dumps a
              # process there when sending it SIGQUIT, as a test or timeout.jl does
              # to end a hung process. There is no debugger; dumps are only uploaded,
              # the oldest first, and test_julia.sh deletes those beyond the first
              # few while the tests run.
              core_pattern: "C:/buildkite-agent/dumps/*.dmp"
              compressor: "zstd"
              max_uploads: 3
          - JuliaCI/external-buildkite#v1:
              version: "./.buildkite-external-version"
              repo_url: "https://github.com/JuliaCI/julia-buildkite"
        timeout_in_minutes: ${TIMEOUT?}
        soft_fail: ${ALLOW_FAIL?}
        commands: "bash .buildkite/utilities/test_julia.sh"
        agents:
          queue: "test"
          sched_cpus: "6"
          sched_cpus_limit: "6"
          sched_mem_gib: "${SCHED_MEM_GIB:-24}"
          os: "windows"
          arch: "${ARCH}"
        env:
          JULIA_SHELL: "/bin/bash"
          TRIPLET: "${TRIPLET?}"
