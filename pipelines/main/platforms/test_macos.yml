steps:
  - group: "${GROUP?}"
    steps:
      - label: ":macos: test ${TRIPLET?}"
        key: "test_${TRIPLET?}"
        depends_on:
          - "build_${TRIPLET?}"
        plugins:
          - JuliaCI/coreupload#v2:
              core_pattern: "**/*.core"
              compressor: "zstd"
              create_bundle: "true"
              lldb_commands:
                - "bt all"
          - JuliaCI/external-buildkite#v1:
              version: "./.buildkite-external-version"
              repo_url: "https://github.com/JuliaCI/julia-buildkite"
        timeout_in_minutes: ${TIMEOUT?}
        soft_fail: ${ALLOW_FAIL?}
        commands: "bash .buildkite/utilities/test_julia.sh"
        agents:
          queue: "test"
          # macOS jobs get the whole host whatever these say
          sched_cpus: "4"
          sched_threads: "4"
          sched_mem_gib: "16"
          os: "macos"
          arch: "${ARCH}"
        env:
          JULIA_SHELL: "/bin/bash"
          TRIPLET: "${TRIPLET?}"
          BUILDKITE_CANCEL_SIGNAL: "SIGQUIT"
