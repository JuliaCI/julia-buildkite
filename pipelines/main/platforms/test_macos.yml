steps:
  - group: "${GROUP?}"
    steps:
      - label: ":macos: test ${TRIPLET?}"
        key: "test_${TRIPLET?}"
        depends_on:
          - "build_${TRIPLET?}"
        plugins:
          - JuliaCI/coreupload#v2:
              core_pattern: "**/*.core"
              compressor: "zstd"
              create_bundle: "true"
              lldb_commands:
                - "bt all"
          - JuliaCI/external-buildkite#v1:
              version: "./.buildkite-external-version"
              repo_url: "https://github.com/JuliaCI/julia-buildkite"
        timeout_in_minutes: ${TIMEOUT?}
        # Retry if the agent was lost (-1 without a signal reason) or stopped under the job
        # (agent_stop, with whatever status the job exited with): a host or scheduler
        # restart. Timeouts and cancellations have signal_reason "cancel" and are not retried.
        retry:
          automatic:
            - exit_status: -1
              signal_reason: [none, agent_stop]
              limit: 1
            - exit_status: "*"
              signal_reason: agent_stop
              limit: 1
        soft_fail: ${ALLOW_FAIL?}
        commands: "bash .buildkite/utilities/test_julia.sh"
        agents:
          queue: "test"
          # macOS jobs get the whole host whatever these say
          sched_cpus: "4"
          sched_threads: "4"
          sched_mem_gib: "16"
          os: "macos"
          arch: "${ARCH}"
        env:
          JULIA_SHELL: "/bin/bash"
          TRIPLET: "${TRIPLET?}"
          BUILDKITE_CANCEL_SIGNAL: "SIGQUIT"
