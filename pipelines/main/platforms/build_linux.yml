steps:
  - group: "${GROUP?}"
    steps:
      - label: ":linux: build ${TRIPLET?}"
        key: "build_${TRIPLET?}"
        plugins:
          - JuliaCI/coreupload#v2:
              core_pattern: "**/*.core"
              compressor: "zstd"
              create_bundle: "true"
          - JuliaCI/external-buildkite#v1:
              version: "./.buildkite-external-version"
              repo_url: "https://github.com/JuliaCI/julia-buildkite"
          - JuliaCI/julia#v1:
              # Drop default "registries" directory, so it is not persisted from execution to execution
              persist_depot_dirs: packages,artifacts,compiled
              version: '1.10' # GREP_ME: Keep this updated to LTS. Do not set it to '1' or 'stable' or 'latest'.
          - JuliaCI/sandbox#v2:
              rootfs_url: https://github.com/JuliaCI/rootfs-images/releases/download/${ROOTFS_TAG?}/${ROOTFS_IMAGE_NAME?}.${ARCH_ROOTFS?}.tar.gz
              rootfs_treehash: "${ROOTFS_HASH?}"
              uid: 1000
              gid: 1000
              workspaces:
                # Include `/cache/repos` so that our `git` version introspection works.
                - "/cache/repos:/cache/repos"
        timeout_in_minutes: ${TIMEOUT?}
        soft_fail: ${ALLOW_FAIL?}
        if: pipeline.slug != "julia-pr" || "${SKIP_PR:-}" != "yes"
        commands: "bash .buildkite/utilities/build_julia.sh"
        agents:
          queue: "build"
          # Builds are serial for about half their time: charged 4 CPUs, they run
          # on a cpuset of 16. Memory: the 95th percentile of the builds' mean use
          # (what they are charged), limited at 40 GiB for their link-time peaks.
          sched_cpus: "${SCHED_CPUS:-4}"
          sched_cpus_limit: "${SCHED_CPUS_LIMIT:-16}"
          sched_mem_gib: "${SCHED_MEM_GIB:-3}"
          sched_mem_limit_gib: "${SCHED_MEM_LIMIT_GIB:-40}"
          # Only run on `sandbox.jl` machines (not `docker`-isolated ones) since we need nestable sandboxing
          sandbox_capable: "true"
          os: "linux"
          arch: "${ARCH?}"
        env:
          JULIA_SHELL: "/bin/bash"
          # Receive some environment mappings from our templating engine
          TRIPLET: "${TRIPLET?}"
          MAKE_FLAGS: "${MAKE_FLAGS?}"
          ROOTFS_IMAGE_NAME: "${ROOTFS_IMAGE_NAME?}"
          JULIA_CI_BUILD_MODE: "${JULIA_CI_BUILD_MODE-}"
          BUILDKITE_CANCEL_SIGNAL: "SIGQUIT"
