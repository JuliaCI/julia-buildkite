---
name: ShellCheck
on:
  push:
    branches:
      - 'main'
      - 'release-*'
  pull_request:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    name: ShellCheck
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run shellcheck on all .sh files
        shell: bash
        run: |
          failures=0
          while IFS= read -r -d '' file; do
              echo "Checking file '${file}'..."
              if ! shellcheck "${file}"; then
                  failures=$((failures + 1))
              fi
          done < <(find . -type f -name '*.sh' -print0)
          if [[ "${failures}" -gt 0 ]]; then
              echo "Shellcheck failed for ${failures} files."
          fi
          exit "${failures}"
      - name: Test the job width rule
        run: python3 utilities/tests/test_width.py
      - name: Test the core dump limits
        run: python3 utilities/tests/test_core_dumps.py
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1'
      - name: Test the choice of sources of the Windows toolchain installer
        run: julia --startup-file=no utilities/tests/test_install_toolchain.jl
